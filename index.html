  #st div { margin: 2px 0; }
  .ok { color: #5cc93a; } .bad { color: #e06464; }
  p { max-width: 280px; margin: 16px auto 0; }
  button { margin-top: 14px; padding: 10px 22px; border: 0; background: #5cc93a; color: #08130b; font: 700 15px system-ui, sans-serif; }

="#0a1a0d"/><rect x="12" y="20" width="1.02" height="1.02" fill="#2f7d1f"/><rect x="13" y="20" width="1.02" height="1.02" fill="#0a1a0d"/><rect x="12" y="21" width="1.02" height="1.02" fill="#0a1a0d"/></svg><b>BRAINROT LUCK</b><div class="bar"><i></i></div></div><div id="st"></div></div>
<script>
// Переходник: Telegram открывает эту страницу, она проверяет все адреса сервера параллельно
// и переходит на первый доступный (прямой — в приоритете), сохраняя данные Telegram из #hash.
(function () {
  var OK_HOST = /^([a-z0-9.-]+\.(trycloudflare\.com|sslip\.io|nip\.io|workers\.dev)|\d{1,3}(\.\d{1,3}){3})$/;
  var qs = new URLSearchParams(location.search);
  var direct = (qs.get('d') || '').split(',').filter(function (h) { return OK_HOST.test(h); });
  var workers = (qs.get('w') || '').split(',').filter(function (h) { return OK_HOST.test(h); });
  var tunnel = workers.concat(OK_HOST.test(qs.get('t') || '') ? [qs.get('t')] : []);
  var st = document.getElementById('st');
  var t0 = Date.now();
  var done = false;
  var state = {};
  var names = {};
  direct.forEach(function (h, i) { names[h] = 'Сервер ' + (i + 1); });
  tunnel.forEach(function (h) { names[h] = /workers\.dev$/.test(h) ? 'Резервный 1 (Worker)' : 'Резервный 2 (туннель)'; });

  function draw() {
    // статусы показываем, только если проверка затянулась — обычно переход занимает <1 с
    if (Date.now() - t0 < 1500 && !done) return;
    st.innerHTML = Object.keys(names).map(function (h) {
      var s = state[h] || '…';
      var cls = s === 'доступен' || s === 'открываю' ? 'ok' : s === '…' ? '' : 'bad';
      return '<div class="' + cls + '">' + names[h] + ': ' + s + '</div>';
    }).join('');
  }
  setInterval(draw, 500);

  function probe(host, ms) {
    return new Promise(function (resolve, reject) {
      var ctrl = new AbortController();
      var to = setTimeout(function () { ctrl.abort(); }, ms);
      fetch('https://' + host + '/ping?_=' + Date.now(), { cache: 'no-store', signal: ctrl.signal })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          clearTimeout(to);
          if (t.indexOf('BrainrotLuck') === 0) { state[host] = 'доступен'; resolve(host); }
          else { state[host] = 'чужой ответ'; reject(); }
        })
        .catch(function (e) {
          clearTimeout(to);
          state[host] = e && e.name === 'AbortError' ? 'не отвечает (' + Math.round(ms / 1000) + ' с)' : 'заблокирован или недоступен';
          reject();
        });
    });
  }
  function go(host) {
    if (done) return; done = true;
    state[host] = 'открываю'; draw();
    location.replace('https://' + host + '/' + location.hash);
  }
  function fail() {
    done = true; draw();
    document.getElementById('box').innerHTML = '<b>BRAINROT LUCK</b><p>Не получилось связаться с сервером. Сделай скрин этого экрана и отправь админу.</p><button id="re">Ещё раз</button>';
    document.getElementById('re').onclick = function () { location.reload(); };
  }

  // все адреса проверяются сразу. Прямой адрес главнее: если он ответил, идём на него.
  // Туннель берём, только когда прямые не ответили (в РФ Cloudflare грузит приложение обрезанным).
  var directOk = false, directLeft = direct.length, tunnelHost = null, tunnelLeft = tunnel.length;
  function decide() {
    if (done) return;
    if (directOk) return;
    if (directLeft === 0 && tunnelHost) return go(tunnelHost);
    if (directLeft === 0 && tunnelLeft === 0) return fail();
  }
  direct.forEach(function (h) {
    probe(h, 4000).then(function () { directOk = true; go(h); }, function () { directLeft--; decide(); });
  });
  tunnel.forEach(function (h) {
    probe(h, 10000).then(function () { tunnelHost = h; decide(); }, function () { tunnelLeft--; decide(); });
  });
  if (!direct.length && !tunnel.length) fail();
})();
</script>
