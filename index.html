  if (!root) return;
  var PAL = ['#ffe066', '#0a1a0d', '#e6ffa6', '#a6f03c', '#5cc93a', '#2f7d1f', '#3a9a28', '#3fa52c'];
  var PX = 'BA0EA1FA1GA2HA3IA1KA1LA2MA2NA1OA1AB0BB0CB0DB1EB2FB2GB3HB4IB4JB1KB2LB2MB2NB2OB3PB1BC0CC1DC1EC2FC3GC4HC4IC4JC1KC2LC2MC2NC3OC4PC1QC1BD1CD2DD2ED3FD4GD4HD4ID4JD1KD2LD2MD3ND4OD4PD4QD4RD1BE1CE2DE3EE4FE4GE4HE4IE5JE1KE2LE3ME4NE4OE4PE4QE5RE1AF1BF2CF3DF4EF4FF4GF6HF5IF5JF1KF3LF4MF6NF4OF4PF5QF5RF5SF1AG1BG3CG4DG4EG4FG4GG5HG6IG5JG1KG4LG6MG4NG4OG5PG5QG5RG5SG1BH1CH4DH4EH4FH5GH5HH5IH6JH1KH6LH4MH4NH5OH5PH5QH5RH1CI1DI1EI1FI1GI1HI1II1JI6KI6LI1MI1NI1OI1PI1QI1BJ1CJ2DJ2EJ2FJ2GJ3HJ4IJ6JJ6KJ6LJ2MJ2NJ2OJ3PJ4QJ4RJ1AK1BK2CK2DK2EK2FK3GK4HK6IK4JK1KK2LK6MK2NK3OK4PK4QK4RK4SK1AL1BL2CL2DL2EL3FL4GL6HL4IL4JL1KL2LL2ML6NL4OL4PL4QL4RL5SL1BM1CM2DM3EM4FM4GM4HM4IM5JM1KM2LM3MM4NM4OM4PM4QM5RM1BN1CN3DN4EN4FN4GN4HN5IN5JN1KN3LN4MN4NN4ON4PN5QN5RN1CO1DO1EO4FO4GO5HO5IO5JO1KO4LO4MO4NO4OO5PO1QO1DP1EP4FP5GP5HP5IP5JP7KP7LP4MP4NP5OP5PP1EQ1FQ1GQ5HQ5IQ1JQ1KQ7LQ4MQ5NQ1OQ1GR1HR1JR1KR7LR1MR1KS1LS5MS1KT1LT5MT5NT1LU1MU5NU1MV1';
  var CELLS = 12;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var warm = /[?&]l=1(&|$)/.test(location.search); // пришли из лаунчера — клевер уже собран

  var css = '' +
    '#loader{position:fixed;inset:0;z-index:100;overflow:hidden;background:linear-gradient(#0a130d,#030604);-webkit-user-select:none;user-select:none}' +
    '#loader.x{background:none;pointer-events:none}' +
    '.ld-fx{position:absolute;inset:0;width:100%;height:100%;display:block}' +
    '.ld-st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-bottom:4vh}' +
    '.ld-cl{position:relative;width:132px;height:146px}' +
    '.ld-cw{position:absolute;left:0;top:0;width:132px;height:132px}' +
    '.ld-cw svg{width:132px;height:132px;display:block;overflow:visible;filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}' +
            '.ld-sh{position:absolute;left:36px;bottom:0;width:60px;height:6px;background:rgba(0,0,0,.42);clip-path:polygon(6px 0,calc(100% - 6px) 0,calc(100% - 6px) 2px,100% 2px,100% 4px,calc(100% - 6px) 4px,calc(100% - 6px) 100%,6px 100%,6px 4px,0 4px,0 2px,6px 2px);}' +
    '.ld-cw.idle{animation:ldBob 1.6s steps(8) infinite}' +
    '.ld-cl.idle .ld-sh{animation:ldShB 1.6s steps(8) infinite}' +
    '@keyframes ldBob{25%{transform:translateY(-7px) rotate(-5deg)}50%{transform:none}75%{transform:translateY(-7px) rotate(5deg)}}' +
    '@keyframes ldShB{25%,75%{transform:scaleX(.78);opacity:.7}}' +
    '.ld-cw.pop{animation:ldPop .18s steps(3) forwards}' +
    '@keyframes ldPop{from{transform:none}to{transform:scale(1.16)}}' +
    '.ld-lg{display:flex;gap:2px;font:700 31px/1 "Pixelify Sans",monospace;letter-spacing:.02em}' +
    '.ld-lg span{display:inline-block;color:#5cc93a;text-shadow:0 3px 0 #1c4a14;animation:ldDrop .5s steps(6) calc(120ms + var(--i) * 45ms) both}' +
    '.ld-lg span.w{color:#fff;text-shadow:0 3px 0 #1c3322}.ld-lg span.lc{clip-path:polygon(0 0,100% 0,100% 34%,52% 34%,52% 66%,100% 66%,100% 100%,0 100%)}' +
    '.ld-lg .gap{width:10px}' +
    '@keyframes ldDrop{0%{transform:translateY(-28px);opacity:0}50%{transform:translateY(3px);opacity:1}75%{transform:translateY(-2px)}100%{transform:none}}' +
    '.ld-bar{display:flex;gap:3px;padding:4px;background:#0d1a11;box-shadow:inset 0 0 0 2px #1d3424;animation:ldIn .25s steps(3) .55s both}' +
    '.ld-bar i{width:10px;height:8px;background:#15241a}' +
    '.ld-bar i.on{background:#5cc93a;box-shadow:inset 0 -2px 0 #3f9c2a;animation:ldCell .24s steps(2)}' +
    '@keyframes ldCell{from{background:#e6ffa6;box-shadow:none}}' +
    '@keyframes ldIn{from{opacity:0;transform:scaleX(.4)}}' +
    '.ld-msg{display:none;max-width:280px;margin:0;text-align:center;color:#86a08e;font:600 14px/1.45 system-ui,sans-serif}' +
    '.ld-msg button{display:block;margin:14px auto 0;padding:10px 24px;border:0;background:#5cc93a;color:#08130b;font:700 15px system-ui,sans-serif;box-shadow:inset 0 -3px 0 #3f9c2a;cursor:pointer}' +
    '.ld-msg button:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 #3f9c2a}' +
    '#loader.err .ld-msg{display:block;animation:ldIn .25s steps(3) both}#loader.err .ld-bar{display:none}' +
    '#loader.warm .ld-cw rect,#loader.warm .ld-lg span,#loader.warm .ld-bar,#loader.warm .ld-sh{animation:none}' +
    '#loader.out.out .ld-lg span{animation:ldFall .36s steps(4) calc(var(--i) * 16ms) both}' +
    '#loader.out.out .ld-bar{animation:ldOut .2s steps(3) both}' +
    '@keyframes ldFall{to{transform:translateY(34px);opacity:0}}' +
    '@keyframes ldOut{to{transform:scaleX(.3);opacity:0}}';
  var st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);

  // ---------- разметка ----------
  var px = [], svg = '<svg viewBox="0 0 22 22" shape-rendering="crispEdges">';
  for (var i = 0; i < PX.length; i += 3) {
    var x = PX.charCodeAt(i) - 65, y = PX.charCodeAt(i + 1) - 65, c = +PX[i + 2];
    var dx = x - 10.5, dy = y - 10.5, dist = Math.sqrt(dx * dx + dy * dy);
    var a = Math.atan2(dy, dx) + (Math.random() - 0.5) * 1.2, far = 6 + Math.random() * 10;
    px.push({ x: x, y: y, c: c });
    svg += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + PAL[c] + '" style="--d:' + Math.round(dist * 32 + Math.random() * 120) +
      'ms;--dx:' + (Math.cos(a) * far).toFixed(1) + 'px;--dy:' + (Math.sin(a) * far).toFixed(1) + 'px"/>';
  }
  svg += '</svg>';
  var word = 'BRAINROT', word2 = 'LUCK', lg = '', n = 0;
  for (i = 0; i < word.length; i++) lg += '<span style="--i:' + n++ + '">' + word[i] + '</span>';
  lg += '<span class="gap"></span>';
  for (i = 0; i < word2.length; i++) lg += '<span class="w' + (word2[i] === 'C' ? ' lc' : '') + '" style="--i:' + n++ + '">' + word2[i] + '</span>';
  var cells = '';
  for (i = 0; i < CELLS; i++) cells += '<i></i>';
  root.innerHTML = '<canvas class="ld-fx"></canvas><div class="ld-st"><div class="ld-cl"><div class="ld-cw">' + svg +
    '</div><div class="ld-sh"></div></div><div class="ld-lg">' + lg + '</div><div class="ld-bar">' + cells + '</div><div class="ld-msg"></div></div>';
  if (warm || reduce) root.classList.add('warm');

  var cl = root.querySelector('.ld-cl'), cw = root.querySelector('.ld-cw'), rects = cw.querySelectorAll('rect');
  var cellEls = root.querySelectorAll('.ld-bar i'), msg = root.querySelector('.ld-msg');
  var cv = root.querySelector('canvas'), cx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;
  function size() {
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  size();
  addEventListener('resize', size);

  // ---------- блик по пикселям ----------
  function light(hex) {
    var v = parseInt(hex.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
    function m(k) { return Math.round(k + (255 - k) * 0.5); }
    return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
  }
  var LIGHT = PAL.map(light);
  var t0 = Date.now(), introMs = warm || reduce ? 0 : 550;
  setTimeout(function () {
    if (root.classList.contains('out')) return;
    cw.classList.add('idle'); cl.classList.add('idle');
  }, introMs);
  var sweep = null;
  function shine() {
    if (!root.isConnected || root.classList.contains('out') || reduce) return;
    var pos = -3;
    clearInterval(sweep);
    sweep = setInterval(function () {
      pos += 1.5;
      for (var k = 0; k < px.length; k++) {
        var p = px[k], s = p.x + p.y, on = p.c !== 1 && s >= pos - 1 && s <= pos + 1;
        rects[k].setAttribute('fill', on ? LIGHT[p.c] : PAL[p.c]);
      }
      if (pos > 46) clearInterval(sweep);
    }, 28);
  }
  setTimeout(function loop() { shine(); if (root.isConnected && !root.classList.contains('out')) setTimeout(loop, 2600); }, introMs + 300);

  // ---------- шкала ----------
  var shown = warm ? 7 : 0, target = 0, lastStep = 0, floor = warm ? 7 / CELLS : 0, waiters = [];
  for (i = 0; i < shown; i++) cellEls[i].className = 'on';
  var barT = setInterval(function () {
    if (!root.isConnected) return clearInterval(barT);
    var el = Date.now() - t0;
    if (el < introMs + 150) return;
    // сама ползёт к ~85%, остаток — когда всё правда загрузилось
    var auto = floor + (0.86 - floor) * (1 - Math.exp(-(el - introMs) / 2200));
    var want = Math.max(target, auto);
    var need = Math.min(CELLS, Math.floor(want * CELLS + 1e-6));
    if (shown < need && el - lastStep >= (target > auto ? 30 : 90)) { cellEls[shown].className = 'on'; shown++; lastStep = el; }
    for (var k = waiters.length - 1; k >= 0; k--) if (shown >= waiters[k].n) { var f = waiters[k].f; waiters.splice(k, 1); f(); }
  }, 30);
  function fillTo(p, cb) {
    target = Math.max(target, p);
    var nn = Math.min(CELLS, Math.floor(p * CELLS + 1e-6));
    if (shown >= nn) return cb();
    waiters.push({ n: nn, f: cb });
  }

  // ---------- канвас: пыль, плитки, осколки ----------
  var dust = [];
  for (i = 0; i < 38; i++) dust.push({ x: Math.random(), y: Math.random(), s: [2, 2, 3, 3, 4][i % 5], v: 6 + Math.random() * 16, a: 0.1 + Math.random() * 0.28, ph: Math.random() * 6.3 });
  var exitAt = 0, tiles = null, shards = null, TILE = 26, EXIT_MS = 720, last = performance.now();
  function grad() { var g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a130d'); g.addColorStop(1, '#030604'); return g; }
  function frame(now) {
    if (!root.isConnected) return;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    cx.clearRect(0, 0, W, H);
    var e = exitAt ? (now - exitAt) / EXIT_MS : 0;
    if (tiles) {
      cx.fillStyle = grad();
      for (var k = 0; k < tiles.length; k++) {
        var t = tiles[k], q = 1 - Math.min(1, Math.max(0, (e - t.th) / 0.2));
        q = Math.ceil(q * 4) / 4;
        if (q <= 0) continue;
        var sz = q >= 1 ? TILE + 1 : TILE * q;
        cx.fillRect(Math.round(t.x + (TILE - sz) / 2), Math.round(t.y + (TILE - sz) / 2), Math.ceil(sz), Math.ceil(sz));
      }
    }
    var da = tiles ? Math.max(0, 1 - e * 1.6) : 1;
    if (da > 0) {
      for (k = 0; k < dust.length; k++) {
        var d = dust[k];
        d.y -= d.v * dt / H;
        if (d.y < -0.02) { d.y = 1.02; d.x = Math.random(); }
        var tw = Math.sin(now / 700 + d.ph) > 0.2 ? 1 : 0.55;
        cx.fillStyle = 'rgba(92,201,58,' + (d.a * tw * da).toFixed(3) + ')';
        cx.fillRect(Math.round(d.x * W + Math.sin(now / 1300 + d.ph) * 6), Math.round(d.y * H), d.s, d.s);
      }
    }
    if (shards) {
      var alive = 0;
      for (k = 0; k < shards.length; k++) {
        var s = shards[k];
        s.vy += 1100 * dt; s.vx *= 0.985; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
        if (s.life <= 0 || s.y > H + 20) continue;
        alive++;
        cx.globalAlpha = Math.min(1, s.life / 0.25);
        cx.fillStyle = s.c;
        var z = s.life < 0.35 ? Math.max(2, Math.round(s.s * 0.6)) : s.s;
        cx.fillRect(Math.round(s.x), Math.round(s.y), z, z);
      }
      cx.globalAlpha = 1;
      if (!alive && e > 1.25) return root.remove();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function shatter() {
    var r = cw.querySelector('svg').getBoundingClientRect(), u = r.width / 22, ccx = r.left + r.width / 2, ccy = r.top + r.height / 2;
    shards = px.map(function (p) {
      var dx = p.x - 10.5, dy = p.y - 10.5, L = Math.sqrt(dx * dx + dy * dy) || 1, sp = 220 + Math.random() * 520;
      return { x: r.left + p.x * u, y: r.top + p.y * u, s: Math.max(3, Math.round(u)), c: PAL[p.c],
        vx: dx / L * sp + (Math.random() - 0.5) * 120, vy: dy / L * sp - 260 - Math.random() * 260, life: 0.8 + Math.random() * 0.7 };
    });
    tiles = [];
    var cols = Math.ceil(W / TILE), rows = Math.ceil(H / TILE), maxD = Math.sqrt(W * W + H * H) / 2 + TILE;
    for (var yy = 0; yy < rows; yy++) for (var xx = 0; xx < cols; xx++) {
      var tx = xx * TILE, ty = yy * TILE, ddx = tx + TILE / 2 - ccx, ddy = ty + TILE / 2 - ccy;
      tiles.push({ x: tx, y: ty, th: Math.sqrt(ddx * ddx + ddy * ddy) / maxD * 0.72 + Math.random() * 0.1 });
    }
    cl.style.visibility = 'hidden';
    var stg = root.querySelector('.ld-st');
    setTimeout(function () { stg.style.visibility = 'hidden'; }, 600);
    root.classList.add('x');
    exitAt = performance.now();
  }

  var leaving = false;
  window.LD = {
    // реальный прогресс загрузки 0..1
    progress: function (p) { target = Math.max(target, Math.min(0.95, p)); },
    // лаунчер: дозаполнить шкалу до середины и уйти на сервер
    handoff: function (cb) { fillTo(7 / CELLS, function () { setTimeout(cb, 90); }); },
    // приложение готово: шкала до конца, клевер лопается, экран растворяется
    done: function (cb) {
      if (leaving) return; leaving = true;
      cb = cb || function () {};
      if (reduce) { cb(); root.style.transition = 'opacity .3s'; root.style.opacity = 0; setTimeout(function () { root.remove(); }, 320); return; }
      fillTo(1, function () {
        setTimeout(function () {
          clearInterval(sweep);
          for (var k = 0; k < px.length; k++) rects[k].setAttribute('fill', PAL[px[k].c]);
          root.classList.add('out');
          cw.classList.remove('idle'); cl.classList.remove('idle');
          cw.classList.add('pop');
          setTimeout(function () { shatter(); cb(); }, 190);
        }, 140);
      });
    },
    fail: function (text, btn, onBtn) {
      root.classList.add('err');
      msg.innerHTML = '';
      var p = document.createElement('div'); p.textContent = text; msg.appendChild(p);
      var b = document.createElement('button'); b.textContent = btn || 'Ещё раз';
      b.onclick = onBtn || function () { location.reload(); };
      msg.appendChild(b);
    }
  };
})();
</script>
<script>
// Переходник: Telegram открывает эту страницу, она проверяет все адреса сервера параллельно
// и переходит на первый доступный (прямой — в приоритете), сохраняя данные Telegram из #hash.
(function () {
  var OK_HOST = /^([a-z0-9.-]+\.(trycloudflare\.com|sslip\.io|nip\.io|workers\.dev)|\d{1,3}(\.\d{1,3}){3})$/;
  var qs = new URLSearchParams(location.search);
  var noParams = !qs.get('d') && !qs.get('w') && !qs.get('t');
  if (noParams) { qs.set('d', '84.22.149.210'); qs.set('w', 'brainrot.zxcozonofficial.workers.dev'); }
  var direct = (qs.get('d') || '').split(',').filter(function (h) { return OK_HOST.test(h); });
  var workers = (qs.get('w') || '').split(',').filter(function (h) { return OK_HOST.test(h); });
  var tunnel = workers.concat(OK_HOST.test(qs.get('t') || '') ? [qs.get('t')] : []);
  var done = false;

  function probe(host, ms) {
    return new Promise(function (resolve, reject) {
      var ctrl = new AbortController();
      var to = setTimeout(function () { ctrl.abort(); }, ms);
      fetch('https://' + host + '/ping?_=' + Date.now(), { cache: 'no-store', signal: ctrl.signal })
        .then(function (r) { return r.text(); })
        .then(function (t) { clearTimeout(to); if (t.indexOf('BrainrotLuck') === 0) resolve(host); else reject(); })
        .catch(function () { clearTimeout(to); reject(); });
    });
  }
  function go(host) {
    if (done) return; done = true;
    LD.progress(0.5);
    LD.handoff(function () { location.replace('https://' + host + '/?l=1' + location.hash); });
  }
  function fail() {
    if (done) return; done = true;
    LD.fail('Не получилось подключиться. Проверь интернет и попробуй ещё раз.');
  }

  // все адреса проверяются сразу. Прямой адрес главнее: если он ответил, идём на него.
  // Запасной берём, только когда прямые не ответили.
  var directOk = false, directLeft = direct.length, tunnelHost = null, tunnelLeft = tunnel.length;
  function decide() {
    if (done || directOk) return;
    if (directLeft === 0 && tunnelHost) return go(tunnelHost);
    if (directLeft === 0 && tunnelLeft === 0) return fail();
  }
  direct.forEach(function (h) {
    probe(h, 4000).then(function () { directOk = true; go(h); }, function () { directLeft--; decide(); });
  });
  tunnel.forEach(function (h) {
    probe(h, 10000).then(function () { tunnelHost = h; decide(); }, function () { tunnelLeft--; decide(); });
  });
  if (!direct.length && !tunnel.length) fail();
})();
</script>
